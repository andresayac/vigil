[workspace]
resolver = "3"
members = ["crates/vigil-i18n", "crates/vigil-sys", "crates/vigil-scan", "crates/vigil-actions", "crates/vigil-maint", "crates/vigil-core", "crates/vigil-app"]

[workspace.package]
version = "2.4.0"
edition = "2024"
license = "MIT"
authors = ["andresayac"]
repository = "https://github.com/andresayac/vigil"
rust-version = "1.90"

[profile.release]
# Small, fast binary: the app ships as a single executable. "s" makes it about a quarter smaller
# than 3 (32 MB instead of 44) with the same start-up time, memory and processor use. Panics keep
# unwinding and every check stays on.
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
