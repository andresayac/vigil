name: Release

# Push a tag such as v1.0.0 to build the installer and the portable executable and attach them
# to a draft GitHub release. Review the draft, then publish it by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The release build compiles the window's shaders with fxc.exe from the Windows SDK, which
      # the runner image includes (the build finds the newest one).
      - name: Build Vigil
        run: cargo build --release -p vigil-app
      - name: Build the installer
        shell: pwsh
        run: |
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq "vigil-app").version
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "NSIS could not be installed" }
          }
          & $makensis /V2 "/DVERSION=$version" "/DEXE=$PWD\target\release\vigil.exe" "/DOUT=$PWD\dist-release\Vigil_${version}_x64-setup.exe" installer\vigil.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Copy-Item target/release/vigil.exe "dist-release/Vigil-$version-portable.exe"
          # LF line ends, so `sha256sum -c SHA256SUMS.txt` works everywhere.
          $lines = Get-ChildItem dist-release | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$PWD/dist-release/SHA256SUMS.txt", ($lines -join "`n") + "`n")
      - uses: actions/upload-artifact@v4
        with:
          name: vigil-windows
          path: dist-release/*
      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist-release/* --draft --generate-notes --title "Vigil ${{ github.ref_name }}"
