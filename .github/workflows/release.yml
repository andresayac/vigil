name: Release

# Push a tag such as v1.0.0 to build the installer and the portable executable and attach them
# to a draft GitHub release. Review the draft, then publish it by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build the UI
        run: npm run build
      - name: Build the installer
        run: npx tauri build
      - name: Collect the files
        shell: pwsh
        run: |
          $version = (Get-Content crates/vigil-app/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe dist-release/
          Copy-Item target/release/vigil.exe "dist-release/Vigil-$version-portable.exe"
          # LF line ends, so `sha256sum -c SHA256SUMS.txt` works everywhere.
          $lines = Get-ChildItem dist-release | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$PWD/dist-release/SHA256SUMS.txt", ($lines -join "`n") + "`n")
      - uses: actions/upload-artifact@v4
        with:
          name: vigil-windows
          path: dist-release/*
      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist-release/* --draft --generate-notes --title "Vigil ${{ github.ref_name }}"
