name: Release

# Push a tag such as v1.0.0 to build the installer and the portable executable and attach them
# to a draft GitHub release. Review the draft, then publish it by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The release build compiles the window's shaders with fxc.exe from the Windows SDK, which
      # the runner image includes (the build finds the newest one).
      - name: Build Vigil
        run: cargo build --release -p vigil-app
      - name: Build the installer
        shell: pwsh
        run: installer\build-setup.ps1 -Out dist-release
      # The runner is an administrator without a UAC prompt: install, check, upgrade (from itself
      # and from the last 1.x release) and uninstall the setup before anything is published.
      - name: Test the installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force old-setup | Out-Null
          gh release download v1.9.0 --pattern "*-setup.exe" --dir old-setup
          if ($LASTEXITCODE -ne 0) { Write-Warning "no 1.x setup to upgrade from" }
          $setup = Get-ChildItem dist-release\*-setup.exe | Select-Object -First 1
          $old = Get-ChildItem old-setup\*-setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $version = Get-Content dist-release\version.txt
          if ($old) {
            installer\test-installer.ps1 -Setup $setup.FullName -Version $version -OldSetup $old.FullName
          } else {
            installer\test-installer.ps1 -Setup $setup.FullName -Version $version
          }
          if ($LASTEXITCODE -ne 0) { throw "the installer test failed" }
      - name: Collect the files
        shell: pwsh
        run: |
          $version = Get-Content dist-release\version.txt
          Remove-Item dist-release\version.txt
          Copy-Item target/release/vigil.exe "dist-release/Vigil-$version-portable.exe"
          # LF line ends, so `sha256sum -c SHA256SUMS.txt` works everywhere.
          $lines = Get-ChildItem dist-release | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$PWD/dist-release/SHA256SUMS.txt", ($lines -join "`n") + "`n")
      - uses: actions/upload-artifact@v4
        with:
          name: vigil-windows
          path: dist-release/*
      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist-release/* --draft --generate-notes --title "Vigil ${{ github.ref_name }}"
