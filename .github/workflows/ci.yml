name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # The real window, in demo mode (fictitious data, nothing read or changed): every page and dialog
  # starts, stays up, panics nowhere and has no focusable control without a name for screen
  # readers, in light and dark and in the five languages. The captures are kept as an artifact.
  window:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Vigil (debug)
        run: cargo build -p vigil-app
      - name: Every page and dialog
        shell: powershell
        run: |
          installer\smoke-window.ps1 -Exe target\debug\vigil.exe -Out window-smoke
          if ($LASTEXITCODE -ne 0) { throw "the window smoke test failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-smoke
          path: window-smoke/
          if-no-files-found: ignore
          retention-days: 7

  # The runner is an administrator without a UAC prompt: the setup is really installed, checked,
  # upgraded over itself and over the last 1.x release, and uninstalled.
  installer:
    # Runs on pull requests too, so a setup that does not install never reaches main.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Vigil
        run: cargo build --release -p vigil-app
      - name: Build the setup
        shell: pwsh
        run: installer\build-setup.ps1 -Out dist
      - name: Download the last 1.x setup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force old-setup | Out-Null
          gh release download v1.9.0 --pattern "*-setup.exe" --dir old-setup
          if ($LASTEXITCODE -ne 0) { Write-Warning "no 1.x setup to upgrade from" }
          exit 0
      - name: Install, check, upgrade and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          $old = Get-ChildItem old-setup\*-setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $version = Get-Content dist\version.txt
          if ($old) {
            installer\test-installer.ps1 -Setup $setup.FullName -Version $version -OldSetup $old.FullName
          } else {
            installer\test-installer.ps1 -Setup $setup.FullName -Version $version
          }
          if ($LASTEXITCODE -ne 0) { throw "the installer test failed" }
