[package]
name = "vigil-app"
description = "Vigil: security inspection, live performance and maintenance for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "vigil"
path = "src/main.rs"

[lib]
name = "vigil_app"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vigil-i18n = { path = "../vigil-i18n" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vigil-sys = { path = "../vigil-sys" }
vigil-actions = { path = "../vigil-actions" }
vigil-maint = { path = "../vigil-maint" }
vigil-scan = { path = "../vigil-scan" }
vigil-core = { path = "../vigil-core" }

[dependencies.windows]
version = "0.62"
features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
]
