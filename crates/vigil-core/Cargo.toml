[package]
name = "vigil-core"
description = "Vigil's frontend-independent service layer: shared state, request checks, native confirmation and the action path"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
vigil-i18n = { path = "../vigil-i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vigil-sys = { path = "../vigil-sys" }
vigil-actions = { path = "../vigil-actions" }
vigil-maint = { path = "../vigil-maint" }
vigil-scan = { path = "../vigil-scan" }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
]
