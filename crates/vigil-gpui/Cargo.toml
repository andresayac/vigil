[package]
name = "vigil-gpui"
description = "Vigil with a native interface drawn by GPUI (gpui-kit): migration prototype"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "vigil-gpui"
path = "src/main.rs"

[dependencies]
# Pinned: GPUI moves fast and gpui-kit pins its GPUI snapshot (gpui-pre =0.3.12) exactly.
gpui-kit = "=0.10.0"
# Already built for GPUI: channels between the worker threads and the UI thread.
futures = "0.3"
raw-window-handle = "0.6"
serde_json = "1"
vigil-core = { path = "../vigil-core" }
vigil-i18n = { path = "../vigil-i18n" }
vigil-sys = { path = "../vigil-sys" }

[dependencies.windows]
version = "0.62"
features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_SystemInformation",
]
