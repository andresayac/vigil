[package]
name = "vigil-sys"
description = "Windows access layer for Vigil: processes, live metrics, network connections and elevation."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dev-dependencies]
serde_json = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
sha1_smol = "1"
sha2 = "0.10"

[dependencies.windows]
version = "0.62"
features = [
    "Wdk_System_SystemInformation",
    "Wdk_System_Threading",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Networking_BackgroundIntelligentTransferService",
    "Win32_Networking_NetworkListManager",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_EventLog",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_TpmBaseServices",
    "Win32_System_UpdateAgent",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
