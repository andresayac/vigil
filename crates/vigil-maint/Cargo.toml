[package]
name = "vigil-maint"
description = "Maintenance layer for Vigil: disk cleanup, space analysis, Recycle Bin, hardware inventory, tuning state and health insights."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
vigil-i18n = { path = "../vigil-i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
]
